name: forecast

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv --directory pipeline sync --frozen
          npm --prefix web ci
      - name: Build site
        run: npm --prefix web run build
      - name: Forecast
        run: uv --directory pipeline run python -m myhaze.jobs.forecast --out "$GITHUB_WORKSPACE/web/out/data"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: env.HAS_CLOUDFLARE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-data
          path: web/out/data
          retention-days: 2
